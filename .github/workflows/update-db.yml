name: Update hair DB

# 週1で新着の新商品だけを差分取り込み、ベクトル等を更新してコミットする。
# 語彙（HAIR_SHAPE_ALLOWLIST）が変わった週は全ベクトルを自動再生成する。
# 手動実行(workflow_dispatch)も可。画像はコミットしない(.gitignore)。
on:
  schedule:
    - cron: "17 3 * * 1"   # 毎週月曜 03:17 UTC（負荷が偏らない半端な時刻に）
  workflow_dispatch: {}

# 同時実行を1つに制限（重複クロール防止）
concurrency:
  group: update-db
  cancel-in-progress: false

permissions:
  contents: write   # data/*.json をコミット&プッシュするため

jobs:
  update:
    runs-on: ubuntu-latest
    # 通常は差分のみ(~10分)。語彙変更週は全再生成＋画像DLで長引くため余裕を持たせる
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WD Tagger モデル(~400MB)をキャッシュ。初回のみDL。
      - name: Cache tagger model
        uses: actions/cache@v4
        with:
          path: cache/hf
          key: wd-swinv2-tagger-v3

      # サムネ画像のキャッシュ（語彙変更時の全再生成で使う。毎回保存＝差分だけ増える）
      - name: Cache thumbnails
        uses: actions/cache@v4
        with:
          path: images
          key: booth-thumbs-${{ github.run_id }}
          restore-keys: |
            booth-thumbs-

      - name: Install deps (差分更新に必要な最小限)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml numpy onnxruntime Pillow pandas huggingface_hub

      - name: Run differential update
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python src/step13_update.py

      # 語彙（コードの許可リスト）が data/hair_vocab.json から変わっていれば
      # 全商品のベクトルを再生成（変わっていなければ即スキップ）
      - name: Rebuild vectors if vocab changed
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python src/step14_rebuild_vectors.py --if-changed

      - name: Commit updated DB if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/hair_vectors.json data/hair_vocab.json data/product_stats.json data/full_vectors.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
          else
            git commit -m "chore: 差分更新（新着髪型を取り込み） [skip ci]"
            git push
          fi
